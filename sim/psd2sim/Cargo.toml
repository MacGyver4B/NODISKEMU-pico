[package]
name = "psd2sim"
version = "0.1.0"
edition = "2021"
description = "Bruecke: NODISKEMU-pico in picoem an VICE (simlink, IEEE-488 + IEC)"

[dependencies]
# picoem mit den psd2-Korrekturen (CPS-Bits, SIO GPIO_HI_OUT/OE)
rp2350-emu = { git = "https://github.com/MacGyver4B/picoem", branch = "psd2" }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
debug = false
